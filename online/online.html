<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naruto Pixel Card Game - Online 1v1</title>
    <link rel="stylesheet" href="../combate/combate2.css">
    <style>
        #online-status { text-align: center; padding: 10px; color: #fff; background: rgba(0,0,0,0.7); }
        #online-status.hidden { display: none; }
        .online-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; flex-direction: column; color: #fff; }
        .online-overlay.hidden { display: none; }
        .online-overlay h2 { margin-bottom: 20px; }
        .online-overlay button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="turn-banner" class="turn-banner hidden"></div>
    <div id="screen-flash" class="screen-flash"></div>

    <div id="online-status">
        <span id="online-status-text">Conectando...</span>
    </div>

    <div id="game-area" class="game-section active-section">
        <div id="game-container">
            <div id="game-header">
                <h1>Naruto Card - Online 1v1</h1>
                <div class="header-controls">
                    <button id="sound-toggle" class="icon-button" title="Ligar/Desligar som">🔊</button>
                    <a href="../interface/interface.html" class="icon-button" title="Voltar ao menu">🏠</a>
                </div>
            </div>

            <div id="battle-status-container">
                <div id="player-status-side" class="status-side">
                    <div class="side-header">
                        <div class="player-avatar">YOU</div>
                        <h2 id="player-name-display">Jogador</h2>
                    </div>
                    <div id="player-combo" class="combo-display"></div>
                    <div class="stats-display">
                        <div class="bar-container health-bar" data-label="Vida">
                            <div id="player-health-bar-fill" class="bar-fill"></div>
                        </div>
                        <div id="player-health-feedback" class="feedback-container"></div>
                        <div class="bar-container chakra-bar" data-label="Chakra">
                            <div id="player-chakra-bar-fill" class="bar-fill"></div>
                        </div>
                        <div id="player-chakra-feedback" class="feedback-container"></div>
                        <div class="bar-container defense-bar" data-label="Defesa">
                            <div id="player-defense-bar-fill" class="bar-fill"></div>
                        </div>
                        <div id="player-defense-feedback" class="feedback-container"></div>
                        <div id="player-status-effects" class="status-effects"></div>
                        <div id="player-temp-stats" class="temp-stats"></div>
                    </div>
                    <div class="hand-controls">
                        <button class="scroll-arrow left-arrow" data-target="player-hand">&lt;</button>
                        <div id="player-hand" class="hand-area"><p>Mão Jogador</p></div>
                        <button class="scroll-arrow right-arrow" data-target="player-hand">&gt;</button>
                    </div>
                    <div class="deck-info">
                        <span id="player-deck-count">Deck: 0</span>
                        <span id="player-discard-count">Descarte: 0</span>
                    </div>
                </div>

                <div id="opponent-status-side" class="status-side">
                    <div class="side-header">
                        <div class="player-avatar opponent-avatar">??</div>
                        <h2 id="opponent-name-display">Oponente</h2>
                    </div>
                    <div id="opponent-combo" class="combo-display"></div>
                    <div class="stats-display">
                        <div class="bar-container health-bar" data-label="Vida">
                            <div id="opponent-health-bar-fill" class="bar-fill"></div>
                        </div>
                        <div id="opponent-health-feedback" class="feedback-container"></div>
                        <div class="bar-container chakra-bar" data-label="Chakra">
                            <div id="opponent-chakra-bar-fill" class="bar-fill"></div>
                        </div>
                        <div id="opponent-chakra-feedback" class="feedback-container"></div>
                        <div class="bar-container defense-bar" data-label="Defesa">
                            <div id="opponent-defense-bar-fill" class="bar-fill"></div>
                        </div>
                        <div id="opponent-defense-feedback" class="feedback-container"></div>
                        <div id="opponent-status-effects" class="status-effects"></div>
                        <div id="opponent-temp-stats" class="temp-stats"></div>
                    </div>
                    <div class="hand-controls">
                        <button class="scroll-arrow left-arrow" data-target="opponent-hand">&lt;</button>
                        <div id="opponent-hand" class="hand-area"><p>Mão Oponente</p></div>
                        <button class="scroll-arrow right-arrow" data-target="opponent-hand">&gt;</button>
                    </div>
                    <div class="deck-info">
                        <span id="opponent-deck-count">Deck: 0</span>
                        <span id="opponent-discard-count">Descarte: 0</span>
                    </div>
                </div>
            </div>

            <div id="game-board">
                <div class="turn-indicator">
                    Turno <span id="turn-counter">1</span>
                    <span id="phase-label" class="phase-label">Aguardando...</span>
                </div>
                <div id="message-log">Log da Batalha:</div>
                <div class="game-buttons">
                    <button id="end-turn-button" class="game-button primary">Finalizar Turno</button>
                    <button id="leave-match-button" class="game-button secondary">Sair da Partida</button>
                </div>
            </div>
        </div>
    </div>

    <div id="queue-overlay" class="online-overlay">
        <h2 id="queue-title">Procurando partida...</h2>
        <p id="queue-text">Aguardando outro jogador entrar na fila.</p>
        <button id="cancel-queue">Cancelar</button>
    </div>

    <div id="result-overlay" class="online-overlay hidden">
        <h2 id="result-title">Resultado</h2>
        <button id="back-to-menu">Voltar ao Menu</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="../combate/audio.js"></script>
    <script src="online.js"></script>
    <script src="../auto-update.js"></script>
</body>
</html>
